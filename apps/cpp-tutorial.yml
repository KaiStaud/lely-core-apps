  # boot_time: 0 # ms

slave_2:
  dcf: "cpp-slave.eds"
  # dcf_path: ""
  node_id: 2
  # revision_number: 0x12345678
  # serial_number: 0x12345678
  # heartbeat_multiplier: 3.0
  heartbeat_consumer: true
  heartbeat_producer: 1000 # ms
  # error_behavior: {}
