# Datei: .forgejo/workflows/test.yml
name: Runner Test

on: [push]
      
jobs:
  build:
    runs-on: docker
    container:
      image: ubuntu:24.04

    steps:
      - name: Prepare environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get install -y --no-install-recommends \
            curl ca-certificates git gnupg software-properties-common

          # Node.js installieren (für Forgejo Actions)
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y --no-install-recommends nodejs
          node -v
          npm -v
          git --version

          # Forgejo-Zertifikate aktualisieren (wichtig!)
          update-ca-certificates

      - name: Checkout Repository
        uses: https://code.forgejo.org/actions/checkout@v3

      - name: Update & Install Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          export TZ=Etc/UTC

          apt-get update -y
          apt-get install -y --no-install-recommends software-properties-common g++ pkg-config

          add-apt-repository -y ppa:lely/ppa
          apt-get update -y

          # Verhindert tzdata-Prompt
          ln -fs /usr/share/zoneinfo/$TZ /etc/localtime
          apt-get install -y --no-install-recommends tzdata
          dpkg-reconfigure -f noninteractive tzdata

          # Jetzt deine Pakete
          apt-get install -y --no-install-recommends \
            liblely-coapp-dev \
            liblely-co-tools \
            python3-dcf-tools

      - name: generate master.dcf
        run: | 
          dcfgen -r cpp-tutorial.yml 
          ls -la
      - name: Compile canopen controller
        run: | 
          g++ -std=c++14 -Wall -Wextra -pedantic -g -O2 \
            $(pkg-config --cflags liblely-coapp) \
            master.cpp -o master \
            $(pkg-config --libs liblely-coapp)     
      - name: Compile canopen device
        run: |
          g++ -std=c++14 -Wall -Wextra -pedantic -g -O2 \
            $(pkg-config --cflags liblely-coapp) \
            slave.cpp -o slave \
            $(pkg-config --libs liblely-coapp)

      - name: Test Runner
        run: |
          echo "Running in Ubuntu Noble Docker container"
          uname -a
